# Checkov Configuration — Synapse Infrastructure
# https://www.checkov.io/2.Basics/CLI%20Command%20Reference.html
#
# Skipped checks are INTENTIONAL design decisions, not ignored security issues.
# Each skip has a documented reason below.

skip-check:
  # ─── Foundation ────────────────────────────────────────────────────────────────

  # CKV_AWS_130: Public subnets require map_public_ip_on_launch=true
  # Reason: ALB and NAT Gateways need public IPs in public subnets.
  - CKV_AWS_130

  # CKV_AWS_260: Web tier SG allows HTTP (port 80) from 0.0.0.0/0
  # Reason: ALB listens on port 80 (redirect to HTTPS when cert available).
  - CKV_AWS_260

  # CKV2_AWS_5: Security groups not attached to any resource
  # Reason: Modular architecture — SGs defined in foundation, consumed by compute/edge.
  - CKV2_AWS_5

  # ─── Edge (ALB — no domain/cert) ──────────────────────────────────────────────

  # CKV_AWS_2: ALB HTTPS listener
  # Reason: No ACM certificate (no domain). HTTP only until domain is acquired.
  - CKV_AWS_2

  # CKV_AWS_103: ALB TLS 1.2
  # Reason: HTTP-only listener (no TLS termination). Will add when cert available.
  - CKV_AWS_103

  # CKV2_AWS_20: ALB HTTP→HTTPS redirect
  # Reason: No HTTPS listener exists yet (no cert). Cannot redirect to what doesn't exist.
  - CKV2_AWS_20

  # ─── Edge (CloudFront — no domain/cert) ───────────────────────────────────────

  # CKV_AWS_34: CloudFront ViewerProtocolPolicy HTTPS
  # Reason: Using default CF cert which supports HTTPS. allow-all lets HTTP too for
  # compatibility. Will enforce HTTPS-only when custom domain + cert configured.
  - CKV_AWS_34

  # CKV_AWS_174: CloudFront TLS v1.2
  # Reason: Using cloudfront_default_certificate which already uses TLSv1.2+.
  # Checkov false positive — default cert = AWS-managed = TLS 1.2 minimum.
  - CKV_AWS_174

  # CKV2_AWS_42: CloudFront custom SSL certificate
  # Reason: No domain purchased. Using CloudFront default certificate.
  - CKV2_AWS_42

  # CKV_AWS_86: CloudFront access logging
  # Reason: Requires dedicated S3 logging bucket. Deferred to post-launch.
  - CKV_AWS_86

  # CKV_AWS_68: CloudFront WAF
  # Reason: WAF not in scope for initial deployment.
  - CKV_AWS_68

  # CKV_AWS_310: CloudFront origin failover
  # Reason: Single-origin architecture per type (S3 for static, ALB for API).
  # Origin failover requires 2+ origins of same type.
  - CKV_AWS_310

  # CKV_AWS_374: CloudFront geo restriction
  # Reason: restriction_type = "none" is intentional — global access, no geo blocking.
  - CKV_AWS_374

  # CKV2_AWS_32: CloudFront response headers policy
  # Reason: Nice-to-have security headers. Will add in hardening phase.
  - CKV2_AWS_32

  # ─── Compute ──────────────────────────────────────────────────────────────────

  # CKV_AWS_336: ECS container read-only filesystem
  # Reason: synapse containers need write access for scan workspace, project uploads,
  # and source artifact directories.
  - CKV_AWS_336

  # ─── Identity & Secrets ────────────────────────────────────────────────────────

  # CKV_AWS_356: KMS key policy uses * resource
  # Reason: KMS key policies REQUIRE Resource: * by design (they apply to the key itself).
  # AWS docs: "In a key policy, the value of the Resource element is '*', which means
  # 'this KMS key'". This is not a wildcard across all keys.
  - CKV_AWS_356

  # CKV_AWS_109: KMS key policy permissions management
  # Reason: KMS key policy must allow key administrators to manage the key.
  - CKV_AWS_109

  # CKV_AWS_111: KMS key policy write without constraints
  # Reason: Same as above — KMS key policy by definition applies to this key only.
  - CKV_AWS_111

  # CKV_AWS_161: RDS IAM authentication
  # Reason: synapse uses password auth via Secrets Manager managed credentials.
  - CKV_AWS_161

  # CKV2_AWS_57: Secrets Manager automatic rotation
  # Reason: Rotation requires Lambda function. RDS master password uses AWS-managed
  # rotation. Other secrets (api_token, vault_master_key) are static by design.
  - CKV2_AWS_57

  # ─── Data Layer (S3) ──────────────────────────────────────────────────────────

  # CKV_AWS_144: S3 cross-region replication
  # Reason: Single-region architecture (ap-southeast-1). CRR adds cost and complexity
  # not justified for initial deployment.
  - CKV_AWS_144

  # CKV2_AWS_62: S3 event notifications
  # Reason: Event notifications not needed for web bucket or evidence bucket
  # in current architecture.
  - CKV2_AWS_62
