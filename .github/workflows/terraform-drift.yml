name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 2 * * 1-5" # Mon-Fri at 2:00 AM UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Drift Check
    runs-on: ubuntu-latest
    env:
      TF_VERSION: "1.9.8"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKING_DIR: environments/prod
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_BACKEND_REGION: ${{ secrets.TF_BACKEND_REGION || secrets.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform-cached
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: "false"

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          args=(-lock-timeout=5m)
          [ -n "$TF_STATE_BUCKET" ] && args+=("-backend-config=bucket=$TF_STATE_BUCKET")
          [ -n "$TF_BACKEND_REGION" ] && args+=("-backend-config=region=$TF_BACKEND_REGION")
          terraform init "${args[@]}"

      - name: Terraform plan drift check
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m -no-color 2>&1 | tee plan-output.txt
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            echo "::error::Terraform plan failed"
            exit 1
          fi
          exit 0

      - name: Drift detected - fail workflow
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "::warning::Terraform drift detected! Infrastructure has changed outside of Terraform."
          echo "Review manually; do not auto-apply drift changes."
          exit 1
